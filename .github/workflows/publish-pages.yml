name: Publish chatbot editions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: skmagic-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build and test both editions
        run: |
          mkdir -p _site
          node build.cjs --standalone _site/index.html
          node build.cjs --phase-one
          node --test tests/*.cjs
          cp phase-1.html _site/phase-1.html
      - name: Upload chatbot pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy both editions
        id: deployment
        uses: actions/deploy-pages@v4
