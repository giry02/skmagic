<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>SK 인텔릭스 상담봇 델리 | SK매직</title>
  <link rel="stylesheet" href="conversation.css">
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M6 5h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-6l-5 3v-3H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"/><path d="M7.5 10h9m-9 4H13"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1.2 6.7M4 5v5h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18m-14 5h4"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M6 17H3V6h11v11H9m5-8h4l3 4v4h-2m-5 0h2"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/></symbol>
    <symbol id="i-tool" viewBox="0 0 24 24"><path d="M19.8 4.2a5.5 5.5 0 0 0-7 6.8L4.5 19.3a1.8 1.8 0 0 0 2.5 2.5l8.3-8.3a5.5 5.5 0 0 0 6.8-7l-3.6 3.6-2.3-2.3z" transform="translate(-1 -1)"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.8"/><path d="m15 15 4.6 4.6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M7 11h10m-9 4h8"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-1.5a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6V21"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6m-12 4h8m-8 4h6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h2m4 0h2"/></symbol>
    <symbol id="i-water" viewBox="0 0 24 24"><path d="M12 3c3 4.6 6 7.4 6 11a6 6 0 1 1-12 0c0-3.6 3-6.4 6-11Z"/><path d="M9 15a3 3 0 0 0 3 3"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9M7 6a8 8 0 1 0 10 0"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M10.2 4.6a2 2 0 0 1 3.6 0l7 12.4a2 2 0 0 1-1.8 3H5a2 2 0 0 1-1.8-3Z"/><path d="M12 9v4m0 3.5h.01"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l2 12H3zM9 9V6a3 3 0 0 1 6 0v3"/></symbol>
    <symbol id="i-transfer" viewBox="0 0 24 24"><path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M20 9V7a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7m18 5h-4a2 2 0 0 0 0 4h4"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 5h6v6m-8 2 8-8m-9 1H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></symbol>
  </svg>
  <div class="app is-empty" id="app">
    <header class="app-header">
      <div class="brand">
        <button class="catalog-icon-button catalog-toggle" id="catalog-toggle" type="button" aria-label="상담 메뉴 열기" aria-expanded="false" aria-controls="catalog">
          <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg>
          <span>상담 메뉴</span>
        </button>
        <img class="brand-logo" src="sk-magic-logo.png" alt="SK매직" width="88" height="45">
        <div class="brand-copy">
          <h1>SK 인텔릭스 상담봇 ‘델리’</h1>
          <p id="assistant-status" aria-live="polite">온라인 · 챗봇 상담</p>
        </div>
      </div>
      <button class="new-chat" id="new-chat" type="button" aria-label="초기화" title="대화 초기화">
        <svg class="icon" aria-hidden="true"><use href="#i-reset"></use></svg>
      </button>
    </header>
    <div class="workspace">
      <button class="catalog-backdrop" id="catalog-backdrop" type="button" aria-label="상담 메뉴 닫기" tabindex="-1" hidden></button>
      <aside class="catalog" id="catalog" aria-labelledby="catalog-title" tabindex="-1">
        <div class="catalog-heading">
          <h2 id="catalog-title">상담 메뉴</h2>
          <div class="catalog-tools">
            <button id="catalog-all" class="catalog-all" type="button" aria-controls="catalog-list">전체 펼치기</button>
            <button id="catalog-close" class="catalog-icon-button catalog-close" type="button" aria-label="상담 메뉴 닫기">
              <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
            </button>
          </div>
        </div>
        <label class="catalog-search">
          <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
          <input id="catalog-search" type="search" aria-label="상담 업무 검색" placeholder="업무명·번호·상담코드 검색" autocomplete="off">
        </label>
        <div class="catalog-phases" id="catalog-phases" role="group" aria-label="상담 차수"></div>
        <nav class="catalog-list" id="catalog-list" aria-label="상담 업무"></nav>
      </aside>
      <main class="conversation" id="chat-panel" aria-label="델리 챗봇 상담">
        <div class="chat-body" id="chat-scroll">
          <div class="chat-inner">
            <section class="welcome" id="welcome" aria-labelledby="welcome-title">
              <span class="bot-avatar welcome-avatar" aria-hidden="true"></span>
              <h2 id="welcome-title" tabindex="-1">무엇을 도와드릴까요?</h2>
              <p>왼쪽 상담 메뉴에서 업무를 선택하거나 궁금한 내용을 입력해 주세요.</p>
            </section>
            <div class="chat-log" id="chat-log" role="log" aria-label="대화" aria-live="polite" aria-relevant="additions text"></div>
            <div id="chat-controls"></div>
            <div id="chat-status" class="chat-status" role="status" hidden></div>
          </div>
        </div>
        <footer class="composer">
          <div class="composer-inner">
            <form class="message-form" id="message-form">
              <label class="sr-only" id="compose-input-label" for="message-input">질문 입력</label>
              <textarea id="message-input" rows="1" maxlength="1500" placeholder="궁금한 내용을 입력해 주세요." autocomplete="off" enterkeyhint="send"></textarea>
              <input id="secure-input" type="password" maxlength="250" autocomplete="off" enterkeyhint="send" hidden>
              <button type="submit" id="send-chat" aria-label="메시지 보내기" title="메시지 보내기" disabled><span aria-hidden="true"></span></button>
            </form>
            <p class="secure-message" id="secure-message" hidden><svg class="icon" aria-hidden="true"><use href="#i-lock"></use></svg><span>대화 안의 안내에 따라 계속해 주세요.</span></p>
          </div>
        </footer>
        <section class="starters" id="starters" aria-label="자주 묻는 질문">
          <button type="button" class="starter" data-question="정수기 렌탈료는 언제 빠져나가나요?"><svg class="icon" aria-hidden="true"><use href="#i-card"></use></svg><span>렌탈료는 언제 결제되나요?</span><svg class="icon starter-arrow" aria-hidden="true"><use href="#i-arrow"></use></svg></button>
          <button type="button" class="starter" data-question="설치 기사님은 언제 오시나요?"><svg class="icon" aria-hidden="true"><use href="#i-truck"></use></svg><span>설치 기사님은 언제 오시나요?</span><svg class="icon starter-arrow" aria-hidden="true"><use href="#i-arrow"></use></svg></button>
          <button type="button" class="starter" data-question="정수기에서 물이 나오지 않아요."><svg class="icon" aria-hidden="true"><use href="#i-tool"></use></svg><span>정수기에서 물이 나오지 않아요</span><svg class="icon starter-arrow" aria-hidden="true"><use href="#i-arrow"></use></svg></button>
        </section>
      </main>
    </div>
    <dialog class="schedule-sheet" id="schedule-sheet" aria-labelledby="schedule-sheet-title">
      <div class="schedule-sheet-inner">
        <span class="sheet-handle" aria-hidden="true"></span>
        <header class="schedule-sheet-header">
          <svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg>
          <h2 id="schedule-sheet-title" tabindex="-1">예약 가능일 선택</h2>
          <button type="button" class="sheet-icon-button" id="schedule-sheet-close" aria-label="달력 닫기">
            <span class="guide-icon guide-close" aria-hidden="true"></span>
          </button>
        </header>
        <div id="schedule-sheet-content" class="schedule-sheet-content"></div>
        <footer id="schedule-sheet-footer" class="schedule-sheet-footer"></footer>
      </div>
    </dialog>
  </div>
  <noscript>챗봇 상담을 이용하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
  <script src="scenarios.js"></script>
  <script src="partner-cards.js"></script>
  <script src="audit-01-17.js"></script>
  <script src="audit-18-36.js"></script>
  <script src="audit-37-50.js"></script>
  <script src="engine.js"></script>
  <script src="conversation.js"></script>
</body>
</html>
