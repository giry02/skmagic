<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>SK 인텔릭스 상담봇 델리 | SK매직</title>
  <style>
:root {
  color-scheme: light;
  --white: #fff;
  --ink: #1c1e24;
  --quiet: #515963;
  --muted: #767676;
  --line: #cdd1d8;
  --soft: #f2f3f5;
  --accent: #ea002c;
  --accent-pressed: #ba0023;
  --selection: #ff7a00;
  --bot-line: #f2b8c4;
  --user-bubble: #fde8ed;
  --danger: var(--accent-pressed);
  --control-height: 48px;
  --radius: 8px;
  --gutter: 20px;
  font-family: "Malgun Gothic", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  min-width: 280px;
  margin: 0;
  background: var(--white);
  color: var(--ink);
  word-break: keep-all;
  overflow-wrap: anywhere;
}

button, input, textarea { font: inherit; }
button { color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--selection);
  outline-offset: 2px;
}

p, h1, h2, h3 { margin: 0; }
.sr-only, .icon-library {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.icon {
  display: block;
  flex: none;
  width: 20px;
  height: 20px;
  stroke: currentColor;
  stroke-width: 1.65;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}

.guide-icon {
  display: block;
  flex: none;
  width: 20px;
  height: 20px;
  background: center / contain no-repeat;
}

.app {
  --chat-width: 736px;
  --avatar-width: 24px;
  --turn-gap: 10px;
  --turn-indent: calc(var(--avatar-width) + var(--turn-gap));
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

.app-header {
  z-index: 1;
  display: flex;
  flex: none;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 62px;
  padding: 0 clamp(var(--gutter), 3vw, 40px);
  border-bottom: 1px solid var(--line);
  background: var(--white);
}

.brand { display: flex; min-width: 0; align-items: center; gap: 12px; }
.brand-logo { display: block; flex: none; width: 67px; height: 34px; object-fit: contain; }
.brand-copy { min-width: 0; line-height: 1.3; }
.brand-copy h1 { color: var(--accent); font-size: 15px; font-weight: 700; }
.brand-copy p { margin-top: 2px; color: var(--muted); font-size: 12px; }
.new-chat {
  display: flex;
  align-items: center;
  flex: none;
  width: 42px;
  min-height: 42px;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: var(--radius);
  background: var(--white);
  color: var(--selection);
}
.new-chat:hover { background: var(--soft); }
.new-chat .icon { width: 21px; height: 21px; }

.workspace {
  position: relative;
  display: flex;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
}

.catalog {
  z-index: 2;
  display: flex;
  flex: 0 0 clamp(242px, 19vw, 286px);
  flex-direction: column;
  min-height: 0;
  padding: 24px 14px 12px;
  border-right: 1px solid var(--line);
  background: var(--white);
}
.catalog:focus { outline: none; }
.catalog-heading, .catalog-tools, .catalog-search {
  display: flex;
  align-items: center;
}
.catalog-heading {
  flex: none;
  justify-content: space-between;
  gap: 6px;
  min-height: 30px;
  margin: 0 4px 13px 7px;
}
.catalog-heading h2 {
  font-size: 16px;
  letter-spacing: -.04em;
  line-height: 1.3;
}
.catalog-tools { gap: 7px; }

.catalog-all {
  min-height: 30px;
  padding: 4px 7px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--quiet);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.catalog-all:hover {
  background: var(--soft);
  color: var(--accent-pressed);
}

.catalog-search {
  flex: none;
  gap: 7px;
  margin: 0 2px 13px;
  min-height: 39px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--white);
  color: var(--muted);
}
.catalog-search:focus-within {
  border-color: var(--selection);
}
.catalog-search .icon { width: 16px; height: 16px; }
.catalog-search input {
  flex: 1;
  min-width: 0;
  width: 100%;
  padding: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--ink);
  font-size: 13px;
}
.catalog-search input::placeholder { color: var(--muted); opacity: 1; }

.catalog-phases {
  display: grid;
  flex: none;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 5px;
  margin: 0 2px 11px;
}
.catalog-phase-button {
  min-height: 38px;
  padding: 5px 2px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--white);
  color: var(--quiet);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}
.catalog-phase-button:hover { background: var(--soft); color: var(--ink); }
.catalog-phase-button[aria-expanded="true"] {
  border-color: var(--accent);
  background: var(--user-bubble);
  color: var(--accent-pressed);
}
.catalog-phase-button:focus-visible { outline-offset: -3px; }

.catalog-list {
  flex: 1 1 auto;
  min-height: 0;
  padding: 0 2px 7px;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.catalog-group, .catalog-item {
  display: flex;
  align-items: center;
  width: 100%;
  min-width: 0;
  min-height: 39px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  text-align: left;
  overflow-wrap: anywhere;
}
.catalog-list button:focus-visible { outline-offset: -2px; }

.catalog-group {
  gap: 8px;
  margin-bottom: 3px;
  padding: 7px 9px;
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -.022em;
}
button.catalog-group:hover, .catalog-group[aria-expanded="true"] { background: var(--soft); }
.catalog-phase-note { color: var(--quiet); font-size: 11px; font-weight: 500; }
.catalog-group-icon {
  flex: none;
  width: 17px;
  height: 17px;
  color: var(--selection);
}
.catalog-chevron {
  flex: none;
  width: 15px;
  height: 15px;
  margin-left: auto;
  color: var(--muted);
}
.catalog-group[aria-expanded="true"] .catalog-chevron { transform: rotate(90deg); }

.catalog-items {
  display: grid;
  margin: 0 0 7px 16px;
  padding-left: 7px;
  border-left: 1px solid var(--line);
}
.catalog-item {
  min-height: 34px;
  padding: 6px 8px;
  gap: 7px;
  color: var(--quiet);
  font-size: 13px;
  line-height: 1.45;
  letter-spacing: -.02em;
}
.catalog-item .icon { width: 15px; height: 15px; color: var(--muted); }
.catalog-item[aria-current="true"] .icon { color: var(--selection); }
.catalog-item:hover:not(:disabled) { background: var(--soft); color: var(--ink); }
.catalog-item[aria-current="true"] {
  background: var(--user-bubble);
  color: var(--accent-pressed);
  font-weight: 700;
}
.catalog-item:disabled { opacity: .54; }
.catalog-item:disabled[aria-current="true"] { opacity: .78; }
.catalog-results {
  margin: 6px 6px 11px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.catalog-icon-button, .catalog-backdrop { display: none; }

.conversation {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

.chat-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  overscroll-behavior-y: contain;
  scrollbar-gutter: stable both-edges;
}

.chat-inner, .composer-inner, .starters {
  width: min(var(--chat-width), 100% - 2 * var(--gutter));
  margin-inline: auto;
}

.chat-inner { padding: 42px 0 35px; }

.is-empty .conversation {
  display: grid;
  grid-template-rows: minmax(30px, .83fr) auto auto auto minmax(36px, 1.17fr);
  grid-template-areas: "." "intro" "composer" "starters" ".";
  overflow: auto;
}
.is-empty .chat-body { grid-area: intro; overflow: visible; scrollbar-gutter: auto; }
.is-empty .composer { grid-area: composer; }
.is-empty .starters { grid-area: starters; }
.is-empty .chat-inner { padding: 0; }

.welcome {
  display: grid;
  justify-items: center;
  padding: 0 0 31px;
  text-align: center;
}
.welcome h2 {
  margin: 14px 0 8px;
  font-size: clamp(24px, 4.1vw, 34px);
  font-weight: 700;
  line-height: 1.25;
}
.welcome p {
  color: var(--quiet);
  font-size: clamp(13px, 2.5vw, 16px);
  letter-spacing: -.025em;
  line-height: 1.6;
}

.bot-avatar {
  flex: none;

.welcome-avatar {
  width: 46px;
  height: 46px;

.composer {
  flex: none;
  padding: 10px 0 max(var(--gutter), env(safe-area-inset-bottom));
  background: var(--white);
}
.is-empty .composer { padding: 0; }
.message-form {
  display: flex;
  align-items: end;
  gap: 4px;
  min-height: var(--control-height);
  padding: 0 4px 0 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--white);
}
.message-form:focus-within { border-color: var(--selection); }
.message-form textarea, .message-form input {
  flex: 1;
  display: block;
  align-self: center;
  width: 0;
  min-height: 25px;
  max-height: 136px;
  resize: none;
  padding: 0;
  border: 0;
  outline: none;
  background: none;
  color: var(--ink);
  font-size: 15px;
  line-height: 1.55;
}
.message-form :is(textarea, input)::placeholder { color: var(--muted); opacity: 1; }
#send-chat {
  display: inline-grid;
  flex: none;
  place-items: center;
  width: 42px;
  height: 46px;
  padding: 0;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
}
#send-chat:hover:not(:disabled) { background: var(--user-bubble); }

.secure-message {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--control-height);
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--quiet);
  background: var(--soft);
  font-size: 13px;
}
.secure-message .icon { width: 17px; height: 17px; }

.starters {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 9px;
  padding-top: 17px;
}
.starter {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: var(--control-height);
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--white);
  color: var(--quiet);
  font-size: 12px;
  font-weight: 650;
  line-height: 1.35;
  text-align: left;
}
.starter:hover { border-color: var(--selection); color: var(--ink); }
.starter .icon { width: 17px; height: 17px; color: var(--selection); }
.starter .starter-arrow { width: 14px; height: 14px; margin-left: 1px; color: var(--muted); }

.chat-log { display: grid; gap: 24px; }
.turn { display: flex; align-items: start; gap: var(--turn-gap); }
.turn .bot-avatar { margin-top: 3px; }
.turn.user { justify-content: end; }
.turn-content {
  display: grid;
  gap: 8px;
  min-width: 0;
  max-width: min(620px, 100% - var(--turn-indent));
}
.turn.user .turn-content { max-width: min(550px, 90%); }
.bubble {
  width: fit-content;
  padding: 10px 13px;
  border: 1px solid var(--bot-line);
  border-radius: var(--radius);
  background: var(--white);
  font-size: 15px;
  line-height: 1.55;
  white-space: pre-wrap;
}
.turn.user .bubble { border-color: transparent; background: var(--user-bubble); }
.turn-meta, .turn-time { color: var(--muted); font-size: 12px; line-height: 1.3; }
.turn.user .turn-time { text-align: right; }
.turn-meta { font-weight: 700; }
.result-cards { display: grid; gap: 6px; }
.result-card { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); }
.result-card :is(h3, h4) { margin: 0 0 3px; font-size: 13px; line-height: 1.4; }
.result-card p { color: var(--ink); font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
.result-card .card-art { display: block; width: 100%; max-height: 100px; margin-bottom: 7px; object-fit: contain; }
.result-card.has-card-art { background: var(--white); }
.turn.bot > .turn-content:has(> .result-cards) { width: min(520px, 100%); }
.result-records {
  gap: 0;
}
.turn.bot .result-records {
  width: calc(100% + var(--turn-indent));
  margin-inline-start: calc(-1 * var(--turn-indent));
}
.app[data-phase-one] .turn.bot .result-records { width: 100%; margin-inline-start: 0; }
.result-records .result-card { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
.result-records .result-card :is(h3, h4, p) { font-variant-numeric: tabular-nums; }
.result-record-title {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 12px 0 8px;
  border-bottom: 1px solid var(--line);
  font-size: 15px;
  line-height: 1.4;
}
.result-records-compact .result-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2.4fr);
  align-items: baseline;
  gap: 12px;
  padding: 9px 0;
}
.result-records-compact .result-card :is(h3, h4) { margin: 0; color: var(--muted); font-weight: 400; }
.result-records .result-card:not(:has(p)) :is(h3, h4),
.result-records .result-card p:first-child { grid-column: 1 / -1; }
.result-records:not(.result-records-compact) .result-card { padding-inline: 0; }
.card-detail-links { display: flex; flex-wrap: wrap; gap: 7px; }
.card-detail-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 5px 0;
  border-radius: var(--radius);
  color: var(--accent-pressed);
  background: var(--white);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.5;
}
.card-detail-link:hover { text-decoration: underline; }
.card-detail-link .icon { width: 14px; height: 14px; flex: none; color: var(--selection); }

.controls, .workflow-tools, .chat-status {
  width: min(554px, 100%);
  margin: 13px 0 0;
}
.app[data-phase-one] #chat-controls > :is(.controls, .workflow-tools) {
  width: calc(min(554px, 100%) - var(--turn-indent));
  margin-inline-start: var(--turn-indent);
}
.controls:empty { display: none; }
.workflow-tools { margin-top: 12px; }
.workflow-tools p { margin-top: 8px; color: var(--quiet); font-size: 12px; line-height: 1.6; }
.text-button {
  padding: 5px 0;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--accent-pressed);
  font-size: 13px;
  font-weight: 700;
  text-align: left;
}
.text-button:hover { text-decoration: underline; text-underline-offset: 3px; }

.action-list { display: flex; flex-wrap: wrap; gap: 8px; }
.app[data-phase-one] .action-list:not(.action-list--navigation):has(> .action:nth-child(2):last-child):not(:has(> .primary, > .calendar-trigger)) {
  --action-inline-padding: 10px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  max-width: 335px;
}
.action {
  min-height: var(--control-height);
  padding: 6px var(--action-inline-padding, 12px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--white);
  font-size: 14px;
  font-weight: 400;
  text-align: center;
}
.action:hover:not(:disabled) { border-color: var(--selection); }
.action.primary { border-color: var(--accent); background: var(--accent); color: var(--white); font-weight: 700; }
.action.primary:hover:not(:disabled), .action.primary:active:not(:disabled) {
  border-color: var(--accent-pressed);
  background: var(--accent-pressed);
}
.action-list > .action:only-child { width: 100%; }
.action-list > .primary { flex: 1 1 auto; }
.action-list--navigation {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 0;
  max-width: 335px;
}
.action-list--navigation > .action {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-inline: 14px 16px;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  text-align: left;
}
.action-list--navigation > .action:is(:hover, :focus-visible):not(:disabled) { background: var(--soft); }
.action-list--navigation > .action:focus-visible { outline-offset: -2px; }
.action-list--navigation > .action:active:not(:disabled) { background: var(--user-bubble); }
.action-menu-icon { color: var(--selection); }
.action-menu-chevron {
  width: 16px;
  height: 16px;
  margin-inline-start: auto;
  mix-blend-mode: multiply;
}
.choice-cards { display: grid; min-width: 0; }
:is(.card-picker, .result-records) + .action-list { margin-top: 9px; }
.action.choice-card {
  min-width: 0;
  min-height: var(--control-height);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 13px;
  border: 1px solid transparent;
  border-bottom-color: var(--line);
  border-radius: 0;
  background: var(--white);
  text-align: left;
}
a.choice-card { color: inherit; text-decoration: none; }
.action.choice-card:focus-visible { outline-offset: -2px; }
.choice-card[aria-pressed="true"], .selected-date {
  outline: 1.2px solid var(--selection);
  outline-offset: -1.2px;
}
.choice-card-icon {
  display: grid;
  flex: none;
  place-items: center;
  width: 24px;
  height: 24px;
  color: var(--selection);
}
.choice-card-icon[data-product-icon] { background-position: center; background-size: 20px 20px; background-repeat: no-repeat; }

.choice-card-icon .icon { width: 20px; height: 20px; }
.choice-card-copy { display: grid; flex: 1; gap: 2px; min-width: 0; }
.choice-card-copy strong { color: var(--ink); font-size: 14px; font-weight: 400; line-height: 1.35; overflow-wrap: anywhere; }
.choice-card[aria-pressed="true"] .choice-card-copy strong { font-weight: 700; }
.choice-card-detail { color: var(--muted); font-size: 12px; line-height: 1.35; white-space: pre-line; overflow-wrap: anywhere; }
.choice-card-phone { color: var(--quiet); font-size: 11px; line-height: 1.4; }
.choice-card .choice-card-arrow { width: 16px; height: 16px; color: var(--selection); flex: none; }
.workflow-picker {
  display: grid;
  gap: 8px;
  background: var(--white);
}
.workflow-picker-header { display: flex; align-items: center; gap: 8px; padding-block: 5px; }
.workflow-picker-copy { min-width: 0; }
.workflow-picker-header h3 { font-size: 15px; line-height: 1.35; }
.workflow-picker-header h3:focus-visible { outline: 2px solid var(--selection); outline-offset: 2px; }
.workflow-picker-header p { margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.4; }
.selected-date {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: var(--control-height);
  padding: 7px 13px;
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
}
.selected-date .icon { width: 16px; height: 16px; color: var(--selection); }
.calendar-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--ink);
}
.calendar-trigger > .icon { width: 17px; height: 17px; color: var(--selection); }
.calendar-trigger > .guide-icon { width: 14px; height: 14px; }
.controls > .calendar-trigger { margin-top: 9px; }

.schedule-sheet {
  position: fixed;
  inset: auto 0 0;
  width: min(500px, calc(100% - 16px));
  max-width: none;
  max-height: min(90dvh, 740px);
  margin: 0 auto;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 12px 12px 0 0;
  color: var(--ink);
  background: var(--white);
}
.schedule-sheet::backdrop { background: rgb(28 30 36 / 34%); }
.schedule-sheet-inner {
  display: flex;
  flex-direction: column;
  max-height: inherit;
  padding: 12px 16px max(16px, env(safe-area-inset-bottom));
}
.sheet-handle {
  width: 28px;
  height: 2px;
  flex: none;
  align-self: center;
  margin-bottom: 8px;
  border-radius: 20px;
  background: var(--line);
}
.schedule-sheet-header {
  display: flex;
  flex: none;
  align-items: center;
  gap: 8px;
  padding-bottom: 4px;
}
.schedule-sheet-header > .icon { color: var(--selection); }
.schedule-sheet-header h2 { font-size: 19px; }
.schedule-sheet-header h2:focus-visible { outline: 2px solid var(--selection); outline-offset: 3px; }
.schedule-sheet-header .sheet-icon-button { margin-left: auto; }
.sheet-icon-button {
  display: inline-grid;
  flex: none;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
}
.sheet-icon-button:hover:not(:disabled) { background: var(--soft); }
.sheet-icon-button:disabled { opacity: .35; }
.schedule-sheet-content {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
}
.schedule-month-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.schedule-month-heading { font-size: 16px; font-weight: 700; }
.schedule-month-navigation { display: flex; }
.schedule-calendar-grid {
  width: 100%;
  table-layout: fixed;
  border-spacing: 0;
  color: var(--ink);
  text-align: center;
}
.schedule-calendar-grid th {
  height: 30px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 400;
}
.schedule-calendar-grid td { height: 42px; padding: 0; }
.schedule-calendar-day {
  width: min(100% - 4px, 42px);
  height: 38px;
  margin: 0;
  padding: 0;
  border: 1.2px solid transparent;
  border-radius: 0;
  background: var(--white);
  color: var(--ink);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}
.schedule-calendar-day:hover:not(:disabled) { background: var(--soft); }
.schedule-calendar-day:focus-visible { outline-offset: 0; }
.schedule-calendar-day:disabled { color: var(--muted); }
.schedule-calendar-day[data-calendar-state="unavailable"] { background: var(--soft); }
.schedule-calendar-day[aria-current="date"] { font-weight: 700; }
.schedule-calendar-day[aria-pressed="true"] {
  border-color: var(--selection);
  font-weight: 700;
}
.schedule-calendar-hint {
  min-height: 48px;
  padding: 12px 0 8px;
  color: var(--muted);
  font-size: 13px;
}
.schedule-sheet .selected-date {
  margin-top: 7px;
  outline: 0;
  border-block: 1px solid var(--line);
  padding: 7px 0;
}
.schedule-sheet-footer {
  flex: none;
  padding-top: 10px;
  background: var(--white);
}
.schedule-sheet-footer .action { width: 100%; }

.symptom-progress {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-items: stretch;
  gap: 5px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.symptom-progress li {
  padding: 6px 7px;
  border-top: 2px solid var(--line);
  background: var(--soft);
  color: var(--quiet);
  font-size: 11px;
  line-height: 1.35;
}
.symptom-progress li.is-current {
  border-color: var(--accent);
  background: var(--white);
  color: var(--accent-pressed);
  font-weight: 700;
}
.symptom-progress li.is-complete { border-color: var(--accent); }
.symptom-progress strong { display: block; margin-top: 3px; color: var(--ink); font-size: 12px; }
[data-workflow-picker="date"] .workflow-picker-options {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 100px), 1fr));
  gap: 8px;
}
[data-workflow-picker="date"] .choice-card-copy strong { font-variant-numeric: tabular-nums; }
[data-workflow-picker="date"] .choice-card, .partner-carousel .choice-card {
  border-color: var(--line);
  border-radius: var(--radius);
}
[data-workflow-picker="date"] .choice-card { text-align: center; }
[data-workflow-picker="term"] .choice-card-detail,
[data-workflow-picker="consent"] .choice-card-detail { color: var(--accent-pressed); font-weight: 700; }
.partner-toolbar, .partner-arrows { display: flex; align-items: center; gap: 6px; }
.partner-toolbar { justify-content: space-between; margin-bottom: 5px; color: var(--quiet); font-size: 12px; font-weight: 700; }
.partner-arrows .carousel-arrow {
  display: grid;
  place-items: center;
  width: 32px;
  height: 30px;
  padding: 0;
  color: var(--selection);
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.partner-arrows .carousel-arrow:hover:not(:disabled) { border-color: var(--selection); }
.partner-arrows .carousel-arrow:disabled { opacity: .5; cursor: default; }
.partner-arrows .carousel-arrow .icon { width: 15px; height: 15px; }
.carousel-arrow.previous .icon { transform: rotate(180deg); }
.partner-carousel {
  grid-auto-flow: column;
  grid-auto-columns: clamp(164px, 38%, 195px);
  gap: 10px;
  padding: 4px 3px 9px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-padding-inline: 3px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.partner-carousel .choice-card {
  display: grid;
  grid-template-rows: 88px 1fr;
  align-items: start;
  gap: 8px;
  scroll-snap-align: start;
}
.partner-carousel .choice-card:focus-visible { outline-offset: -2px; }
.partner-carousel .card-art { display: block; width: 100%; height: 88px; object-fit: contain; }
.selection-summary {
  display: grid;
  gap: 4px;
  margin-bottom: 8px;
  padding: 9px 11px;
  border-bottom: 2px solid var(--selection);
  background: var(--white);
  color: var(--quiet);
  font-size: 12px;
  line-height: 1.45;
}
.selection-summary strong { color: var(--ink); }
.input-tools { display: grid; gap: 6px; margin: 0 0 8px; }
.input-buttons { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 12px; }
.input-choice-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 100px), 1fr));
  gap: 6px;
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--white);
}
.input-choice-grid .action { padding-inline: 6px; }
.verification-message, .pass-request {
  display: flex;
  align-items: center;
  gap: 10px;
  width: fit-content;
  max-width: 100%;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--ink);
  background: var(--white);
  font-size: 13px;
}
.verification-sender { color: var(--quiet); }
.verification-message { flex-wrap: wrap; }
.verification-code { font-variant-numeric: tabular-nums; letter-spacing: .13em; }
.pass-request { margin-bottom: 8px; }
.pass-mark {
  border-radius: 6px;
  padding: 3px 6px;
  color: var(--accent-pressed);
  background: var(--user-bubble);
  font-size: 11px;
  font-weight: 800;
}
.input-readonly {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  padding: 8px 12px;
  background: var(--soft);
  color: var(--quiet);
  font-size: 12px;
  line-height: 1.45;
}
.input-readonly strong { color: var(--ink); }
.action:disabled { border-color: var(--line); background: var(--soft); color: var(--muted); cursor: default; }

.chat-status {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 20px;
  padding: 8px 12px;
  border: 1px solid var(--bot-line);
  border-radius: var(--radius);
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}
.chat-status.is-error { border-color: var(--accent); color: var(--danger); }
.typing {
  display: flex;
  align-items: center;
  gap: 4px;
}
.typing span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  animation: blink 1.25s infinite alternate ease-in-out;
}
.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 35% { opacity: .32; } 80%, 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .typing span { animation: none; } }

@media (max-width: 840px) {
  .catalog-icon-button {
    display: inline-grid;
    flex: none;
    place-items: center;
    width: 35px;
    height: 35px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--white);
  }
  .catalog-icon-button:hover { background: var(--soft); }
  .catalog-icon-button .icon { width: 18px; height: 18px; }
  .catalog-toggle {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    width: auto;
    padding-inline: 8px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .catalog-backdrop {
    z-index: 2;
    position: absolute;
    display: block;
    inset: 0;
    width: 100%;
    padding: 0;
    border: 0;
    background: #1c1e245c;
  }
  .catalog {
    z-index: 3;
    position: absolute;
    inset: 0 auto 0 0;
    width: min(320px, calc(100vw - 48px));
    padding: 17px 12px max(12px, env(safe-area-inset-bottom));
    visibility: hidden;
    transform: translateX(-101%);
  }
  .catalog-open .catalog {
    visibility: visible;
    transform: none;
    box-shadow: 8px 0 30px #1c1e2426;
  }
  .catalog-search input { font-size: 16px; }
  .catalog-phase-button { min-height: 44px; }
  .catalog-heading { margin-right: 1px; }
}

@media (max-width: 600px) {
  .app-header { gap: 6px; padding-inline: var(--gutter); }
  .brand { gap: 8px; }
  .brand-logo { width: 55px; height: 28px; }
  .brand-copy h1 { font-size: 14px; }
  .new-chat { width: 34px; }
  .chat-inner { padding-block: 18px; }
  .is-empty .conversation { grid-template-rows: minmax(30px, .77fr) auto auto auto minmax(32px, 1.23fr); }
  .welcome { padding-bottom: 25px; }
  .starters { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding-top: 14px; }
  .starter { font-size: 13px; }
  .starter .starter-arrow { margin-inline-start: auto; color: var(--selection); }
  .chat-body { scrollbar-gutter: auto; }
  .chat-log { gap: 20px; }
  .catalog-toggle { width: 32px; padding: 0; justify-content: center; }
  .catalog-toggle span { display: none; }
}

@media (max-width: 340px) {
  .app-header { padding-inline: 12px; }
  .brand-logo { width: 45px; height: 26px; }
  .brand-copy h1 { font-size: 13px; }
}

@media (max-height: 520px) {
  .is-empty .conversation { grid-template-rows: 22px auto auto auto 20px; }
}

noscript { position: fixed; inset: 73px 0 auto; padding: 10px; background: var(--white); text-align: center; }
  </style>

    if (/삼성전자|삼성|에어컨|의류관리기|에어드레서|의류건조기|냉장고|텔레비전|제트봇|세탁기|^tv/.test(key)) return '삼성전자';
    if (!/eonb450/.test(key) && /경동나비엔|가스레?인지|가스렌지|전기레?인지|전기렌지|인덕션|하이라이트|하이브리드(?:전기)?(?:레?인지|렌지)|전기오븐/.test(key)) return '경동나비엔';
    return '';
  }

  function estimateDateRange() {
    const today = new Intl.DateTimeFormat('sv-SE', {
      timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
    const end = new Date(today + 'T12:00:00Z');
    const day = end.getUTCDate();
    end.setUTCDate(1);
    end.setUTCMonth(end.getUTCMonth() + 1);
    const lastDay = new Date(Date.UTC(end.getUTCFullYear(), end.getUTCMonth() + 1, 0)).getUTCDate();
    end.setUTCDate(Math.min(day, lastDay));
    return { today, until: end.toISOString().slice(0, 10) };
  }

  function searchScore(scenario, query) {
    const direct = /^(?:no\.?\s*)?(\d{1,2})(?:번)?$/i.exec(query.trim());
    if (direct) return Number(direct[1]) === scenario.no ? 1000 : 0;
    const consultation = /^상담\s*코드\s*[:#]?\s*(\d+)$/u.exec(query.trim());
    if (consultation) return scenario.consultationCode?.split('/').some((code) => code.trim() === consultation[1]) ? 1000 : 0;
    const compact = normalize(query);
    if (!compact) return 0;
    const firstPhaseCode = scenario.firstPhaseScenario?.split(' ', 1)[0];
    if (firstPhaseCode && normalize(firstPhaseCode) === compact) return 1000;
    const terms = new Set([scenario.displayTitle, scenario.title, ...(scenario.keywords ?? []),
      ...scenario.screens.map((screen) => screen.customer)].map(normalize).filter((term) => term.length > 1));
    if (terms.has(compact)) return 200 + compact.length;
    const matches = [...terms].filter((term) => compact.includes(term));
    const aliasScore = matches.length ? Math.max(...matches.map((term) => term.length)) + 4 : 0;
    let ruleScore = 0;
    for (const rule of scenario.intentRules ?? []) {
      const matchedLengths = rule.map((group) => Math.max(0, ...group.map(normalize)
        .filter((term) => term && compact.includes(term)).map((term) => term.length)));
      if (matchedLengths.every((length) => length > 0)) {
        ruleScore = Math.max(ruleScore, 2 * rule.length + matchedLengths.reduce((sum, length) => sum + length, 0));
      }
    }
    const partial = compact.length > 1 && [...terms].some((term) => term.includes(compact)) ? 1 : 0;
    return Math.max(aliasScore, ruleScore, partial) + 0.01 * matches.length;
  }

  function rankedScenarios(scenarios, text) {
    return scenarios.map((scenario) => ({ scenario, score: searchScore(scenario, text) }))
      .filter((match) => match.score > 0)
      .sort((a, b) => b.score - a.score || a.scenario.no - b.scenario.no);
  }

  function nextOtp(previous) {
    const numbers = new Uint32Array(1);
    if (globalThis.crypto?.getRandomValues) globalThis.crypto.getRandomValues(numbers);
    else numbers[0] = Math.floor(Math.random() * 0x100000000);
    const generated = 100000 + numbers[0] % 900000;
    return String(String(generated) === previous ? 100000 + (generated - 99999) % 900000 : generated);
  }

  class SKIXChat {
    #sessionIdentity = null;
    #pendingIdentity = null;
    #transferCancelled = false;
    #consentSettings = {};
    #enabledCashReceiptContracts = new Set();
    #membershipOptOut = false;
    #transferPayment = {};
    #customerProfile;
    #editedPaymentMethods = {};
    static inboundReviewReply(message) {
      const text = normalize(String(message ?? ''));
      if (!/(?:구독|렌탈|계약).{0,25}심사|심사.{0,12}(?:구독|렌탈|계약)/u.test(text)) return '';
      return '구독 심사나 진행 상황은 신청하신 판매처 또는 상담사가 확인해 드려요. 가입 방법이나 담당자 연락 요청을 확인하실 수 있어요.';
    }

    static corporateReply(message) {
      const text = String(message ?? '').normalize('NFKC');
      const subject = normalize(text)
        .replace(/법인(?:용)?(?:신용|체크)?카드/g, '')
        .replace(/(?:법인(?:사업자|고객|회원|계약|명의|직원)?|(?:회사|기업|기관|단체)(?:의)?(?:명의|계약|계정|고객|사업자))[은는이가을를]?(?:아니고|아니라|아닙니다|아니에요|아닌|말고|빼고|제외하고|제외한)/g, '');
      const entity = /법인|주식회사|유한책임회사|유한회사/u.test(subject)
        || /(?:회사|기업|기관|단체)(?:의)?(?:명의|계약|계정|고객|사업자|구독|렌탈|견적|전용|로그인)/u.test(subject)
        || /기업(?:의)?(?:문의|상담|회원)/u.test(subject)
        || /\b(?:b[\s-]*2[\s-]*b|corporate)\b|(?:^|\s)\(주\)(?=\s|[가-힣])/iu.test(text);
      return entity ? '현재 이 상담은 개인과 개인사업자 고객만 이용할 수 있어요.' : '';
    }

    constructor(scenarios = [], { publicScenarios = scenarios } = {}) {
      this.scenarios = [...scenarios];
      this.publicScenarios = [...publicScenarios];
      this.reset();
    }

    reset({ preserveIdentity = false } = {}) {
      if (!preserveIdentity) {
        this.#sessionIdentity = null;
        this.#transferCancelled = false;
        this.#consentSettings = {};
        this.#enabledCashReceiptContracts.clear();
        this.#membershipOptOut = false;
        this.#transferPayment = {};
        this.#customerProfile = { ...initialCustomerProfile };
        this.#editedPaymentMethods = {};
      }
      this.history = [];
      this.messages = [{ role: 'bot', text: welcome }];
      this.clearWorkflow();
      this.resolving = new Set();
      return this.getState();
    }

    clearWorkflow() {
      this.#pendingIdentity = null;
      this.scenario = null;
      this.screen = null;
      this.context = {};
      this.fields = [];
      this.candidates = [];
    }

    getState() {
      const actions = this.actionList();
      // Address search is an intermediate helper. It remains available during input.
      const submissions = this.fields.some((field) => !field.readonly)
        ? actions.filter((action) => action.requiresFields && action.target !== '$address') : [];
      const [submission] = submissions;
      const method = this.passMethod(submission?.label ?? '');
      const opensApproval = method === 'PASS 전자서명'
        || method === 'PASS 본인인증' && !this.isReusablePass(this.screen.id);
      const advancesOnInput = opensApproval || this.screen?.lookupOnSubmit || this.screen?.advanceOnSubmit
        || ['$verifyOtp', '$auditVerifyOtp'].includes(submission?.target);
      const inputSubmitActionId = submissions.length === 1 && !submission.disabled && advancesOnInput ? submission.id : null;
      return {
        scenario: this.scenario,
        screen: this.screen,
        selection: this.activeSelection(),
        selectedDate: this.selectedScheduleDate(),
        scheduleCalendar: this.scheduleCalendar(actions),
        bookingReview: this.serviceBookingReview(),
        messages: [...this.messages],
        actions: actions.map(({ target, ...action }) => action),
        inputSubmitActionId,
        fields: this.fields.map((field) => ({ ...field })),
        verification: this.context.otpCode && this.#pendingIdentity?.code === this.context.otpCode
          && this.fields.some((field) => field.label === '인증번호')
          ? { kind: 'sms', code: this.context.otpCode } : null,
        placeholder: this.screen?.placeholder || defaultPlaceholder,
        secure: Boolean(this.screen?.secure || this.screen?.id === '$auth' || this.fields.some((field) => field.type === 'password')),
        inputDisabled: Boolean(this.fields.length || ['internal-only', 'closed'].includes(this.screen?.kind) || this.screen?.id === '$auth'),
        canBack: this.history.length > 0,
        detail: this.screen?.condition || '',
        demoCases: this.scenario?.screens.filter((screen) => screen.id !== this.screen?.id).map((screen) => ({
          id: screen.id, label: screen.condition, kind: screen.kind
        })) ?? []
      };
    }

    find(query) {
      if (SKIXChat.corporateReply(query)) return [];
      return rankedScenarios(this.publicScenarios, String(query ?? '')).map(({ scenario }) => scenario);
    }

    remember() {
      this.history.push({
        scenario: this.scenario, screen: this.screen, length: this.messages.length,
        context: { ...this.context }, fields: this.fields.map((field) => ({ ...field })), candidates: [...this.candidates]
      });
    }

    goBack() {
      const previous = this.history.pop();
      if (!previous) return this.getState();
      this.messages.length = previous.length;
      this.scenario = previous.scenario;
      this.screen = previous.screen;
      this.context = previous.context;
      this.fields = previous.fields;
      this.candidates = previous.candidates;
      return this.getState();
    }

    start(no, customerText) {
      if (!this.publicScenarios.some((scenario) => scenario.no === Number(no))) return this.getState();
      this.remember();
      this.openScenario(no, customerText, true);
      return this.getState();
    }

    openScenario(no, customerText, echo) {
      const scenario = this.scenarios.find((item) => item.no === Number(no));
      if (!scenario) return;
      const previous = this.context;
      this.#pendingIdentity = null;
      const previousNo = this.scenario?.no;
      const reuseServiceDetails = previousNo === 11 && scenario.no === 12
        && previous.serviceProduct && previous.serviceSymptom;
      const visitCallbackLink = previous.serviceVisit && ((previousNo === 13 && scenario.no === 34)
        || (previousNo === 34 && scenario.no === 13));
      const reuseVisit = !echo && previous.phoneVerified && ((scenario.no === 13 && ([14, 15].includes(previousNo)
        || previousNo === 12 && this.isKnownSessionOwner()))
        || ([13, 14].includes(previousNo) && [14, 15].includes(scenario.no) && previous.serviceVisit) || visitCallbackLink);
      const billingEntry = billingLookupTarget(scenario.no);
      const singleContract = this.demoBillingContractCount(scenario.no) === 1
        ? auditFlows[scenario.no].screens[billingContractScreens[scenario.no]].singleContract : null;
      const reuseBilling = !echo && previous.billingVerified && billingEntry
        && (this.demoBillingContractCount(previousNo) !== 1 || singleContract);
      const reuseDepositInquiry = !echo && previousNo === 1 && scenario.no === 39 && previous.billingVerified && previous.product === '직수 정수기';
      this.scenario = scenario;
      this.context = { request: customerText || '' };
      if (!echo && previousNo === 19 && scenario.no === 4 && previous.phoneVerified && this.screen?.id === 's7') {
        this.context.documentPaymentProduct = { water: '직수 정수기', air: '공기청정기' }[giroContractKey(previous.billContract)];
      }
      if (!echo && previousNo === 30 && scenario.no === 4 && previous.phoneVerified && this.screen?.id === 'E7') {
        this.context.carePaymentReturn = previous;
      }
      const originalEntry = scenario.no === 6 && this.partnerCards().length
        ? scenario.screens.find((screen) => screen.id === 'S02') ?? scenario.screens[0]
        : scenario.screens[0];
      if (reuseServiceDetails) {
        this.context.serviceProduct = previous.serviceProduct;
        this.context.serviceSymptom = previous.serviceSymptom;
      }
      let entry = reuseServiceDetails ? this.serviceRegistrationEntry() : auditFlows[scenario.no]?.entry;
      if (!echo && previousNo === 10 && this.screen?.id === 'S04' && [4, 5].includes(scenario.no)) {
        Object.assign(this.context, { transferPaymentReturn: true, billingVerified: true, product: '공기청정기' });
        entry = scenario.no === 5 ? 'airArrears' : this.#transferPayment.arrears ? 'transferCurrentCharge' : 'paymentScope';
      }
      if (!echo && scenario.no === 10 && previous.transferPaymentReturn && ['S07', 'installmentResult'].includes(this.screen?.id)) {
        entry = this.transferAirScreen();
      }
      if (!echo && previousNo === 44 && ['s5', 's6', 'installationWaterCustomer', 'installationDishwasherCustomer'].includes(this.screen?.id)
        && scenario.no === 9 && previous.installationProduct) {
        this.context.priorReinstallProduct = previous.installationProduct;
        entry = 'phoneInput';
      }
      if (reuseDepositInquiry) {
        Object.assign(this.context, { billingVerified: true, product: previous.product });
        entry = 's4';
      }
      if (!echo && previousNo === 44 && this.screen?.id === 'E8' && scenario.no === 34 && previous.installationAppointment) {
        this.context.installationAppointment = previous.installationAppointment;
        entry = 'visitCallbackNote';
      }
      if (reuseBilling) {
        Object.assign(this.context, { billingVerified: true, product: previous.product });
        const contractScreen = billingContractScreens[scenario.no];
        const choices = singleContract ? [singleContract.action] : auditFlows[scenario.no]?.screens?.[contractScreen]?.actions;
        const selected = previous.product && choices?.find(([label]) => label === previous.product + ' 선택');
        if (scenario.no === 3 && this.screen?.naverRegistrationRequired) {
          entry = 'naverArrearsApplication';
        } else {
          entry = (scenario.no !== 7 || /위약금|해약비/.test(customerText))
            ? selected?.[1] ?? billingEntry : billingEntry;
        }
      }
      if (reuseVisit) {
        Object.assign(this.context, { phoneVerified: true, maskedPhone: previous.maskedPhone,
          serviceVisit: previous.serviceVisit, sameDayVisit: previous.sameDayVisit, subscriptionVisit: previous.subscriptionVisit,
          visitProfile: previous.visitProfile, visitEdits: previous.visitEdits, cancelledVisits: previous.cancelledVisits,
          visitAddressNeedsDate: previous.visitAddressNeedsDate });
        if (visitCallbackLink) {
          entry = scenario.no === 34 ? 's4' : this.visitDetailScreen();
        } else if (scenario.no === 13) {
          this.showVisitResults();
          return;
        } else {
          entry = this.visitRequestEntry();
        }
      }
      const first = this.screenSource(entry) ?? originalEntry;
      if (echo && first?.kind !== 'internal-only') this.sayUser(customerText || scenario.displayTitle || scenario.title);
      this.show(first);
    }

    showDemoScreen(id) {
      const screen = this.screenSource(id);
      if (!screen) return this.getState();
      this.remember();
      this.context = {};
      this.show(screen, { demo: true });
      return this.getState();
    }

    screenSource(id) {
      if (!id || !this.scenario) return undefined;
      return this.scenario.screens.find((screen) => screen.id === id)
        ?? (auditFlows[this.scenario.no]?.screens?.[id] ? { id } : undefined);
    }

    show(screen, properties = {}) {
      if (!screen) return;
      const patch = auditFlows[this.scenario.no]?.screens?.[screen.id];
      if (patch) {
        const { actions, fields, ...display } = patch;
        screen = { ...screen, ...display };
        if (actions) screen.explicitActions = actions;
        if (fields) screen.explicitFields = fields;
      }
      if (!properties.demo && isBillingContractList(this.scenario.no, screen.id)) {
        const count = this.demoBillingContractCount(this.scenario.no);
        if (count >= 5) {
          this.synthetic('상담사 연결을 통해 안내해드릴 수 있어요.', {
            id: 'paymentContractHandoff', kind: 'handoff', actions: [['상담사 연결', '$handoff']], demo: false
          });
          return;
        }
        if (count === 1) {
          const { action, item } = screen.singleContract;
          screen.explicitActions = [action];
          screen.items = [item];
        }
      }
      if (this.scenario.no === 42 && this.#membershipOptOut && !properties.demo && ['s3', 'E7'].includes(screen.id)) {
        this.execute('optOutStatus');
        return;
      }
      if (this.scenario.no === 48 && screen.id === 's7' && !properties.demo && this.isKnownSessionOwner()
        && this.#enabledCashReceiptContracts.has(this.context.receiptSettingKey)) {
        this.execute('receiptSettingActive');
        return;
      }
      if (screen.resolve && !properties.demo) {
        const key = this.scenario.no + ':' + screen.id;
        if (this.resolving.has(key)) throw new Error('Circular workflow resolution: ' + key);
        const matched = screen.resolve.rules?.find((rule, index) => {
          const matches = this.context.routeMatches?.[screen.id + ':' + index] ?? [];
          return rule.all ? rule.fields.every((field) => matches.includes(field)) : matches.length > 0;
        });
        const target = matched?.target ?? screen.resolve.default;
        if (target && target !== screen.id) {
          this.screen = screen;
          this.resolving.add(key);
          try {
            this.execute(target);
          } finally {
            this.resolving.delete(key);
          }
          return;
        }
      }
      const collectsIdentity = screen.id === 'phoneInput'
        || screen.options?.some((label) => /인증번호 받기/.test(label))
        || screen.explicitActions?.some(([, target]) => target === '$sendOtp');
      const sharedSms = screen.explicitActions?.some(([, target]) => target === '$auditSms');
      if (this.#sessionIdentity && !properties.demo && (collectsIdentity || sharedSms)) {
        const next = sharedSms ? screen.auth?.success
          : auditFlows[this.scenario.no]?.screens?.phoneConfirm?.auth?.success ?? phoneSuccess[this.scenario.no];
        if (next) {
          this.screen = screen;
          this.applyVerifiedIdentity();
          this.execute(next);
          return;
        }
      }
      if (collectsIdentity && !this.context.nativeSmsConsent) {
        this.context.nativeSmsReturn = screen.id;
        const firstPhase = this.scenario.phase === '1차';
        this.synthetic(firstPhase ? phoneConsent + ' 개인사업자는 사업자등록번호도 확인해요.' : phoneConsent, {
          id: '$nativeSmsConsent',
          actions: [['동의하고 계속', '$nativeSmsConsent'],
            ...(firstPhase ? [['개인사업자로 동의하고 계속', [16, 17].includes(this.scenario.no)
              ? '$deliveryBusinessConsent' : '$nativeSmsBusinessConsent']] : []),
            ['동의하지 않음', '$auditSmsDecline']]
        });
        return;
      }
      this.screen = screen;
      if (typeof screen.paymentAmount === 'number') {
        this.context.paymentAmount = screen.paymentAmount;
        this.context.paymentOptions = screen.id;
        this.context.registeredPayment = screen.registeredPayment === 'account' ? savedAccount : savedCard;
        this.context.paymentReceiptRequested = false;
      }
      if (this.context.transferPaymentReturn && ['S07', 'installmentResult'].includes(screen.id)) {
        const amount = this.context.paymentAmount;
        if (amount === 59700 || amount === 79600) this.#transferPayment.arrears = true;
        if (amount === 19900 || amount === 79600) this.#transferPayment.current = true;
      }
      this.candidates = [];
      this.fields = this.buildFields(screen);
      if (!this.fields.length && !properties.demo && this.#sessionIdentity && this.isReusablePass(screen.id)) {
        const targets = optionTargets[this.scenario.no]?.[screen.id] ?? [];
        const choices = screen.explicitActions
          ?? (screen.options ?? []).map((label, index) => [label, targets[index] ?? this.graphTarget(label)]);
        const lookup = choices.find(([label, target]) => this.passMethod(label) === 'PASS 본인인증' && target !== screen.id);
        if (lookup) {
          this.completePass({ method: 'PASS 본인인증', target: lookup[1], source: screen.id, failure: screen.auth?.failure });
          return;
        }
      }
      this.sayScreen(properties);
    }

    synthetic(text, { id = '$synthetic', kind = 'choice', condition = '', actions = [], fields = [], items = [], demo = true, lookupOnSubmit, advanceOnSubmit } = {}) {
      this.show({ id, kind, condition, message: text, explicitActions: actions, explicitFields: fields, items, demo, lookupOnSubmit, advanceOnSubmit });
    }

    buildFields(screen) {
      if (!this.scenario) return [];
      const original = screen.explicitFields ?? fieldsFor(this.scenario.no, screen, this.context);
      const definitions = this.context.nativeSmsBusiness && screen.id === this.context.nativeSmsReturn
        ? [...original, businessRegistration] : original;
      return definitions.map((definition, index) => {
        const item = typeof definition === 'string' ? fieldTemplates[definition] : definition;
        if (!item) throw new Error('Unknown workflow field: ' + definition);
        const type = item.type ?? 'text';
        const sample = item.label === '인증번호' ? this.context.otpCode
          : item.label === '희망 배송일' ? offsetDate(estimateDateRange().today, 7)
          : this.scenario.no === 45 && item.label === '납부 마감일' ? offsetDate(estimateDateRange().today, 1)
          : this.scenario.no === 44 && item.label === '이사 예정일' ? offsetDate(estimateDateRange().today, 5)
          : this.scenario.no === 44 && item.label === '희망 날짜' && this.context.installationMoveDate
            ? nextWeekday(this.context.installationMoveDate)
          : item.label === '카드번호' && this.context.issuer?.last4
            ? '000000000000' + this.context.issuer.last4 : item.sample;
        const keyboard = type === 'password' ? 'numeric' : type === 'tel' ? 'tel' : type === 'email' ? 'email' : undefined;
        return {
          ...item, sample, id: `field-${index}`, type, inputMode: keyboard, required: item.required !== false && !item.readonly,
          value: item.readonly ? item.value ?? this.context.maskedPhone ?? maskNumber(demoPhone) : undefined
        };
      });
    }

    sayScreen(properties) {
      const screen = this.screen;
      const no = this.scenario.no;
      const displayItems = (entries = []) => entries.map((item) => ({ ...item, title: this.fill(item.title), detail: this.fill(item.detail) }));
      const recordGroups = screen.recordGroups?.map(({ title, items }) => ({ title, items: displayItems(items) }));
      const items = recordGroups ? recordGroups.flatMap((record) => record.items) : displayItems(screen.items);
      const message = {
        role: 'bot', text: this.fill(screen.message), items,
        demo: Boolean(screen.demo || properties.demo), status: properties.status, links: screen.links,
        ...(recordGroups && { recordGroups })
      };
      if (this.activeSelection()?.kind === 'service-product') message.items = [];
      if (visitListScreens[no] === screen.id) {
        const visits = this.availableVisits();
        message.text = `미처리 접수가 ${visits.length}건 있어요. 방문예정일이 가까운 순으로 최대 5건을 보여드려요. 확인할 접수를 선택해 주세요.${visits.length > 5 ? ' 다른 접수는 상담사에게 문의해 주세요.' : ''}`;
        message.items = visits.slice(0, 5).map((key) => ({
          title: [serviceVisits[key].product, serviceVisits[key].service].filter(Boolean).join(' '),
          detail: `${this.visitDetail(key)} · ${dateLabel(this.serviceVisitDate(key))}`
        }));
      }
      const visitKey = this.context.serviceVisit;
      if (no === 13 && ['S03', 'S04'].includes(screen.id) || no === 14 && ['visitDetails', 'S02', 'S10'].includes(screen.id)
        || no === 15 && ['visitDetails', 'S03', 'S04', 'S05'].includes(screen.id) || no === 34 && screen.id === 's4') {
        const key = visitKey ?? (screen.id === 'S04' && no === 13 ? 'bidet' : 'water');

    sayUser(text) {

    partnerCards() {
      return window.SKIX_PARTNER_CARDS ?? [];
    }

    serviceProductLabel() {
      const item = this.context.serviceProduct;
      return item ? [item.title, item.detail].filter(Boolean).join(' · ') : '';
    }

    serviceVisitDate(key) {
      const changed = this.context.visitEdits?.[key]?.date;
      if (changed) return changed;
      const { today } = estimateDateRange();
      const days = key === 'water' && this.context.sameDayVisit ? 0 : serviceVisits[key].days;
      return offsetDate(today, days);
    }

    visitDetail(key) {
      const visit = serviceVisits[key];
      return visit.service || this.context.visitEdits?.[key]?.symptom || visit.symptom;
    }

    visitItems(key) {
      const { id, product, service } = serviceVisits[key];
      const changed = this.context.visitEdits?.[key];
      return [
        { title: '접수번호', detail: id },
        { title: '접수제품', detail: product },
        { title: service ? '서비스 종류' : '접수 증상', detail: this.visitDetail(key) },
        { title: '방문 예정일', detail: dateLabel(this.serviceVisitDate(key)) },
        { title: '담당 매니저', detail: '영등포센터 김○○ 매니저' },
        { title: '서비스 받으실 분', detail: '김○○' },

        { title: '방문 주소', detail: changed?.address ? neighborhood(changed.address) : demoAddress }
      ];

    availableVisits() {
      const keys = this.context.visitProfile === 'single' ? ['water']
        : this.context.visitProfile === 'multiple' ? Object.keys(serviceVisits) : ['water', 'bidet'];
      return keys.filter((key) => !this.context.cancelledVisits?.includes(key)).sort((left, right) =>
        this.serviceVisitDate(left).localeCompare(this.serviceVisitDate(right))
        || serviceVisits[left].id.localeCompare(serviceVisits[right].id));
    }

    showVisitResults() {
      const no = this.scenario.no;
      const visits = this.availableVisits();
      if (!visits.length) this.execute({ 13: 'S06', 14: 'S09', 15: 'S06', 34: 'visitNotFound' }[no]);
      else if (visits.length === 1) {
        this.context.serviceVisit = visits[0];
        this.execute(no === 13 ? this.visitDetailScreen() : no === 34 ? 's4' : 'visitDetails');
      } else this.execute(visitListScreens[no]);
    }

      return serviceVisits[this.context.serviceVisit]?.service ? 'S04' : 'S03';
    }

      const sameDay = this.context.serviceVisit && this.serviceVisitDate(this.context.serviceVisit) === estimateDateRange().today;
      if (this.scenario.no === 14) return sameDay ? 'S06' : 'S02';
      return sameDay ? 'S07' : 'S03';

        { title: '수령인 연락처', detail: this.context.maskedPhone || maskNumber(demoPhone) },

    showFirstPhaseEditContext(message, id, visitKey) {
      const no = this.scenario.no;

        this.showPaymentEditContext(message, id);

      if (id === 'changeContract') this.context.paymentEdit = undefined;
      if (paymentEditDetails.has(id)) {
        const record = message.items.find(({ title }) => title === '결제정보');
        if (record) {
          const [method, instrument, day] = record.detail.split('\n');
          const updated = this.#editedPaymentMethods[id];
          const current = updated ?? `${method.replace(/^출금유형 /, '')} · ${instrument}`;
          const contract = id === 'bundlePaymentDetails' ? '정수기·공기청정기 묶음' : message.items[0].title;
          this.context.paymentEdit = { id, contract, current, day };
          if (updated) record.detail = `${updated}\n${day}`;
        }
      } else if (id === 'naverArrearsApplication') {
        this.context.paymentEdit = { contract: message.items[0].detail, current: '', day: '' };
      }
      const target = this.context.paymentEdit;
      if (!target) return;
      const payment = this.context.payment;
      const newMethod = payment && `${payment.account ? '계좌 자동이체 · ' + payment.bank : payment.title + ' 자동납부'} · ${payment.masked}`;
      if (paymentEditSteps.has(id)) {
        message.items = [{ title: '대상 계약', detail: target.contract },
          ...(target.current ? [{ title: '현재 결제수단', detail: target.current }] : []),
          ...(target.day ? [{ title: '현재 결제일', detail: target.day.replace(/^이체일·결제일 /, '') }] : []),

          ...(target.current ? [{ title: '변경 전 결제수단', detail: target.current }] : []), ...message.items];
        if (target.id) this.#editedPaymentMethods = { ...this.#editedPaymentMethods, [target.id]: newMethod };

      const id = this.screen?.id;
      if ((this.scenario?.no === 11 && id === 'S02') || id === 'serviceSymptom' || id === 'editSymptomPicker') return 0;
      if (id === '$symptomGroup') return 1;
      if (id === '$symptomIssue') return 2;
      return null;

    symptomOptions(step) {
      const path = this.context.symptomPath ?? [];
      const family = this.context.serviceProduct?.family ?? serviceVisits[this.context.serviceVisit]?.family ?? 'water';
      const categories = [...(productSymptoms[family] ?? []), ...commonSymptoms];
      if (step === 0) return categories;
      const category = categories.find((item) => item.title === path[0]);
      if (step === 1) return category?.groups ?? [];
      return category?.groups.find((item) => item.title === path[1])?.issues ?? [];
