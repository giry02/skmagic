  function renderSelectedDate(label) {
    const date = element("p", "selected-date");
    date.append(element("span", "", `선택한 날짜 · ${label}`), icon("check"));
    return date;
  }

  function calendarTrigger(flow, selection, label) {
    const trigger = button("", "action calendar-trigger");
    trigger.dataset.calendarTrigger = "";
    trigger.setAttribute("aria-haspopup", "dialog");
    trigger.setAttribute("aria-controls", scheduleSheet.id);
    trigger.append(icon("calendar"), element("span", "", label), guideIcon("next"));
    trigger.addEventListener("click", () => {
      const calendar = flow.scheduleCalendar;
      const first = calendar.selected || (calendar.dates.includes(calendar.preferred) ? calendar.preferred : calendar.dates[0]);
      calendarView = { key: calendar.key, month: first.slice(0, 7) };
      syncScheduleSheet(flow, selection);
      scheduleSheet.showModal();
      scheduleSheetTitle.focus();
    });
    return trigger;
  }

  function closeScheduleSheet(restoreFocus = false) {
    calendarView = null;
    if (scheduleSheet.open) scheduleSheet.close();
    if (restoreFocus) controls.querySelector("[data-calendar-trigger]")?.focus();
  }

  function renderCalendarMonth(flow, selection) {
    const calendar = flow.scheduleCalendar;
    const month = calendarView.month;
    const [year, monthNumber] = month.split("-").map(Number);
    const first = new Date(Date.UTC(year, monthNumber - 1, 1));
    const lastDay = new Date(Date.UTC(year, monthNumber, 0)).getUTCDate();
    const monthLabel = `${year}년 ${monthNumber}월`;
    const wrapper = element("div", "schedule-month");
    const toolbar = element("div", "schedule-month-toolbar");
    const heading = element("p", "schedule-month-heading", monthLabel);
    heading.setAttribute("aria-live", "polite");
    const navigation = element("div", "schedule-month-navigation");
    for (const [offset, label, symbol, disabled] of [
      [-1, "이전 달", "back", month <= calendar.today.slice(0, 7)],
      [1, "다음 달", "next", month >= calendar.dates.at(-1).slice(0, 7)],
    ]) {
      const change = button("", "sheet-icon-button");
      change.dataset.calendarDirection = String(offset);
      change.setAttribute("aria-label", label);
      change.disabled = disabled;
      change.append(guideIcon(symbol));
      change.addEventListener("click", () => {
        calendarView.month = new Date(Date.UTC(year, monthNumber - 1 + offset, 1)).toISOString().slice(0, 7);
        syncScheduleSheet(flow, selection);
      });
      navigation.append(change);
    }
    toolbar.append(heading, navigation);
    const dates = new Set(calendar.dates);
    const grid = element("table", "schedule-calendar-grid");
    grid.setAttribute("aria-label", monthLabel + " 달력");
    const weekdays = element("tr");
    for (const weekday of "일월화수목금토") {
      const header = element("th", "", weekday);
      header.scope = "col";
      weekdays.append(header);
    }
    const head = element("thead");
    head.append(weekdays);
    const body = element("tbody");
    for (let start = 1 - first.getUTCDay(); start <= lastDay; start += 7) {
      const row = element("tr");
      for (let day = start; day < start + 7; day += 1) {
        const cell = element("td");
        if (day >= 1 && day <= lastDay) {
          const iso = `${month}-${String(day).padStart(2, "0")}`;
          const selected = calendar.selected === iso;
          const available = dates.has(iso);
          const state = selected ? "selected" : available ? "available" : iso < calendar.today ? "past" : "unavailable";
          const name = { selected: "선택한 날짜", available: "예약 가능", past: "지난 날짜", unavailable: "예약 불가" }[state];
          const date = button(String(day), "schedule-calendar-day");
          date.dataset.calendarDay = iso;
          date.dataset.calendarState = state;
          date.setAttribute("aria-label", calendarDayLabel.format(new Date(iso + "T12:00:00Z")) + " · " + name);
          if (iso === calendar.today) date.setAttribute("aria-current", "date");
          if (available) date.setAttribute("aria-pressed", String(selected));
          date.disabled = !available;
          date.addEventListener("click", () => finishWorkflowAction(engine.chooseCalendarDate(iso)));
          cell.append(date);
        }
        row.append(cell);
      }
      body.append(row);
    }
    grid.append(head, body);
    wrapper.append(toolbar, grid);
    return wrapper;
  }

  function syncScheduleSheet(flow, selection) {
    if (!calendarView) return;
    const calendar = flow?.scheduleCalendar;
    if (calendar?.key !== calendarView.key) {
      closeScheduleSheet();
      return;
    }
    const active = document.activeElement;
    const activeDay = active?.dataset.calendarDay;
    const activeDirection = active?.dataset.calendarDirection;
    const wasInFooter = scheduleSheetFooter.contains(active);
    scheduleSheetTitle.textContent = selection?.title || "예약 가능일 선택";
    scheduleSheetContent.replaceChildren(renderCalendarMonth(flow, selection));
    if (calendar.selected) {
      scheduleSheetContent.append(renderSelectedDate(flow.selectedDate));
    } else {
      scheduleSheetContent.append(element("p", "schedule-calendar-hint", "예약할 날짜를 선택해 주세요."));
    }
    if (flow.bookingReview?.length) scheduleSheetContent.append(bookingReviewCard(flow.bookingReview));
    const request = flow.actions.find((action) => action.id === calendar.requestId);
    scheduleSheetFooter.replaceChildren();
    scheduleSheetFooter.hidden = !request;
    if (request) {
      const confirm = actionButton({ ...request, primary: true, disabled: !calendar.selected || request.disabled });
      confirm.addEventListener("click", () => applyWorkflowAction(request));
      scheduleSheetFooter.append(confirm);
    }
    if (scheduleSheet.open && (activeDay || activeDirection || wasInFooter)) {
      const restored = activeDay ? scheduleSheetContent.querySelector(`[data-calendar-day="${activeDay}"]`)
        : activeDirection ? scheduleSheetContent.querySelector(`[data-calendar-direction="${activeDirection}"]`)
          : scheduleSheetFooter.firstElementChild;
      (restored && !restored.disabled ? restored : scheduleSheetTitle).focus({ preventScroll: true });
    }
  }

  function bookingReviewCard(items) {
    const product = items.find(({ title }) => title === "제품")?.detail;
    return renderResultCards(items, "A/S 방문 예약 정보", true, product);
  }

  function singleFieldAction(actions) {
    const submissions = actions.filter((action) => action.requiresFields && action.label !== "주소 검색");
    return submissions.length === 1 && !submissions[0].disabled ? submissions[0] : null;
  }

  function renderWorkflow(flow, picker) {
    const actions = flow.actions.filter((action) => action.id !== flow.inputSubmitActionId);
    const choices = element("div", "controls");
    const visual = picker?.actions.filter((action) => action.id !== flow.inputSubmitActionId) ?? actions.filter((action) => action.card);
    const visualIds = new Set(visual.map(({ id }) => id));
    const plain = actions.filter(({ id }) => !visualIds.has(id));
    if (flow.screen?.id === "$auth") {
      const request = element("div", "pass-request");
      const sign = actions.some((action) => action.label === "전자서명 확인");
      request.append(element("span", "pass-mark", "PASS"), element("strong", "", sign ? "전자서명" : "본인인증"));
      choices.append(request);
    }
    if (!picker && !visual.length && flow.selection?.detail) {
      const summary = element("div", "selection-summary");
      summary.append(element("strong", "", flow.selection.title), element("span", "", flow.selection.detail));
      choices.append(summary);
    }
    const inputTools = renderInputTools(flow);
    if (inputTools.childElementCount) choices.append(inputTools);
    if (picker) choices.append(renderWorkflowPicker(visual, picker.selection));
    else if (visual.length) choices.append(renderCardOptions(visual, flow.selection));
    if (flow.bookingReview?.length) {
      choices.append(bookingReviewCard(flow.bookingReview));
    }
    if (plain.length) {
      const actionMenu = phaseOne ? flow.screen?.actionMenu : null;
      const list = element("div", actionMenu ? "action-list action-list--navigation" : "action-list");
      if (actionMenu) {
        list.setAttribute("role", "group");
        list.setAttribute("aria-label", "결제정보 관련 메뉴");
      }
      const isResult = ["result", "closed"].includes(flow.screen?.kind);
      const primary = plain.find(({ label, requiresFields }) => (!isResult || requiresFields)
        && /^(?:다음|계속|확인)(?: 단계)?$|(?:요청|접수|예약|납부|결제|발송|발급|변경|저장|인증 확인|전자서명 확인)$/u.test(label)
        && !/조회|다른|다시|내역|방법|없이|나중|유지|보기/u.test(label));
      for (const action of plain) {
        const calendar = flow.scheduleCalendar;
        const disabled = action.disabled || action.id === calendar?.requestId && !calendar.selected;
        const option = action.id === calendar?.moreActionId
          ? calendarTrigger(flow, picker?.selection, action.label)
          : actionButton({ ...action, primary: action === primary, disabled });
        if (actionMenu) {
          const mark = icon(actionMenu[action.label] ?? "arrow");
          const chevron = guideIcon("next");
          mark.classList.add("action-menu-icon");
          chevron.classList.add("action-menu-chevron");
          option.prepend(mark);
          option.append(chevron);
        }
        list.append(option);
      }
      choices.append(list);
    }
    if (flow.scheduleCalendar && !flow.scheduleCalendar.moreActionId) {
      choices.append(calendarTrigger(flow, picker?.selection, "달력 보기"));
    }
    choices.addEventListener("click", (event) => {
      const option = event.target.closest("[data-action]");
      const action = actions.find((item) => item.id === option?.dataset.action);
      if (!action || action.disabled) return;
      if (option.tagName === "A") {
        setTimeout(() => {
          if (option.isConnected) applyWorkflowAction(action);
        }, 0);
      } else {
        applyWorkflowAction(action);
      }
    });
    if (choices.childElementCount) controls.append(choices);

    if (flow.screen?.kind === "internal-only" && flow.detail) {
      const extras = element("div", "workflow-tools");
      extras.append(element("p", "", flow.detail));
      controls.append(extras);
    }
  }

  function renderControls(flow, picker) {
    controls.replaceChildren();
    if (flow) {
      renderWorkflow(flow, picker);
      return;
    }
    if (!offer || activeRequest || failedRequest) return;
    const action = button(offer.displayTitle + " 계속하기", "action");
    action.addEventListener("click", () => startWorkflow(offer));
    const tools = element("div", "workflow-tools");
    tools.append(action);
    controls.append(tools);
  }

  function applyWorkflowAction(action, automatic = false) {
    const progress = inputProgress;
    if (action.requiresFields && progress && pendingField()) {
      const address = progress.fields.find((field) => field.label === "주소");
      if (!/주소 검색/.test(action.label) || !address || !progress.values[address.id]) {
        composerEntry().focus({ preventScroll: true });
        return;
      }
    }
    const next = engine.choose(action.id, progress?.values ?? {}, { echo: !automatic });
    finishWorkflowAction(next, progress, action.requiresFields);
  }

  function finishWorkflowAction(next, progress = null, submitted = false) {
    const length = Math.max(0, next.messages.length - 1);
    inputMessages = inputMessages.filter((item) => item.after <= length);
    const failures = next.screen === progress?.screen ? next.fields.filter((field) => field.error) : [];
    if (failures.length && progress) {
      for (const field of failures) delete progress.values[field.id];
      promptForField(failures[0].error);
    } else if (next.screen !== progress?.screen || (submitted && !pendingField())) {
      inputProgress = null;
    }
    update({ focus: true });
  }

  function inputValue(field, text) {
    if (field.type !== "date") return text;
    const date = /^(\d{4})(?:\s*년\s*|[.\/-])(\d{1,2})(?:\s*월\s*|[.\/-])(\d{1,2})\s*일?$/.exec(text);
    return date ? `${date[1]}-${date[2].padStart(2, "0")}-${date[3].padStart(2, "0")}` : text;
  }

  function captureInput(text) {
    const field = pendingField();
    if (!field) return;
    const value = inputValue(field, String(text ?? "").trim());
    const error = engine.validateFieldValue(field.id, value);
    if (error) {
      promptForField(error);
      update({ focus: true });
      return;
    }
    inputProgress.values[field.id] = value;
    addInputMessage("user", inputEcho(field, value));
    if (pendingField()) {
      promptForField();
      update({ focus: true });
      return;
    }
    const flow = engine.getState();
    const automatic = flow.actions.find((action) => action.id === flow.inputSubmitActionId);
    if (automatic) {
      applyWorkflowAction(automatic, true);
      return;
    }
    const next = singleFieldAction(flow.actions);
    const instruction = next
      ? `입력을 마쳤어요. 위에서 ‘${next.label}’ 버튼을 선택해 주세요.`
      : "입력을 마쳤어요. 위에서 다음 단계를 선택해 주세요.";
    addInputMessage("bot", instruction);
    update({ focus: true });
  }

  function resizeInput() {
    input.style.height = "auto";
    input.style.height = Math.min(136, Math.max(25, input.scrollHeight)) + "px";
    const editor = composerEntry();
    sendButton.disabled = editor.disabled || Boolean(activeRequest) || !editor.value.trim();
  }

  function update({ focus = false, scroll = true } = {}) {
    const flow = demoMode || workflow ? engine.getState() : null;
    const headerStatus = {
      "$chatHandoffReview": "상담 연결 요청 확인",
      "$callbackReview": "전화 상담 요청 확인",
    }[flow?.screen?.id] || "온라인 · 챗봇 상담";
    if (assistantStatus.textContent !== headerStatus) assistantStatus.textContent = headerStatus;
    if (flow?.verification?.code !== revealedCode) revealedCode = null;
    syncInputProgress(flow);
    const messages = getRows();
    const picker = describeWorkflowPicker(flow);
    if (picker?.used.size && messages.at(-1)?.items) {
      const last = messages.at(-1);
      messages[messages.length - 1] = { ...last, items: last.items.filter((item) => !picker.used.has(item)) };
    }
    const empty = !messages.length;
    app.classList.toggle("is-empty", empty);
    byId("welcome").hidden = !empty;
    byId("starters").hidden = !empty;
    renderLog(messages);
    renderControls(flow, picker);
    syncScheduleSheet(flow, picker?.selection);
    renderStatus();
    syncCatalogSelection(flow);

    const field = pendingField();
    const editor = composerEntry();
    const progressive = Boolean(inputProgress);
    const blocked = !progressive && Boolean(flow?.inputDisabled || flow?.secure);
    const privateEntry = editor === secureInput;
    form.hidden = blocked;
    byId("secure-message").hidden = !blocked;
    byId("secure-message").querySelector("span").textContent = flow?.screen?.kind === "internal-only"
      ? "이 업무의 고객 채팅 절차는 검토 중이에요."
      : flow?.screen?.kind === "closed" ? "상단의 초기화 버튼으로 새 대화를 시작할 수 있어요." : "대화 안의 안내에 따라 계속해 주세요.";
    input.hidden = privateEntry;
    secureInput.hidden = !privateEntry;
    const ready = progressive && !field;
    input.disabled = blocked || ready || privateEntry;
    secureInput.disabled = !privateEntry;
    secureInput.inputMode = field?.inputMode || "";
    input.inputMode = privateEntry ? "" : field?.inputMode || "";
    inputLabel.htmlFor = editor.id;
    inputLabel.textContent = field ? field.label + " 입력" : "질문 입력";
    input.maxLength = field ? 250 : 1500;
    const hint = field?.placeholder;
    editor.placeholder = field
      ? field.type === "date" ? "YYYY-MM-DD" : hint && !/예[:시]|example\.com|0000-0000/.test(hint) ? hint : field.label + " 입력"
      : ready ? "위에서 다음 단계를 선택해 주세요."
        : empty ? "궁금한 내용을 입력해 주세요." : (flow?.screen?.placeholder || "이어서 질문해 보세요");
    resizeInput();
    if (focus && !scheduleSheet.open) {
      const pickerHeading = controls.querySelector("#workflow-picker-title");
      const target = pickerHeading || (blocked || ready
        ? controls.querySelector(".action:not(:disabled), button:not(:disabled)") || byId("new-chat")
        : editor);
      target?.focus({ preventScroll: true });
    }
    if (scroll) requestAnimationFrame(() => {
      chatScroll.scrollTop = empty ? 0 : chatScroll.scrollHeight;
    });
  }

  function clearWorkflowDraft() {
    inputProgress = null;
    revealedCode = null;
    input.value = "";
    secureInput.value = "";
  }

  function archiveWorkflow() {
    if (!workflow) return false;
    lastScenario = engine.getState().scenario?.no ?? lastScenario;
    liveRows.push(...getEngineRows());
    engine.reset({ preserveIdentity: true });
    inputMessages = [];
    clearWorkflowDraft();
    workflow = false;
    return true;
  }

  function startWorkflow(scenario, fromMenu = false) {
    if (!scenario || activeRequest) return;
    setDrawer(false, false);
    if (demoMode) {
      clearWorkflowDraft();
      engine.start(scenario.no);
    } else {
      if (!archiveWorkflow()) clearWorkflowDraft();
      workflow = true;
      lastScenario = scenario.no;
      engine.start(scenario.no);
      if (fromMenu && scenario.no !== 50) liveRows.push({ role: "user", text: scenario.displayTitle });
      offer = null;
      failedRequest = null;
    }
    update({ focus: true });
  }

  function clearConversation({ preserveIdentity = false } = {}) {
    if (activeRequest) {
      clearTimeout(activeRequest.timer);
      activeRequest.controller.abort();
      activeRequest = null;
    }
    liveRows = [];
    apiHistory = [];
    workflow = false;
    offer = null;
    failedRequest = null;
    lastScenario = null;
    inputMessages = [];
    clearWorkflowDraft();
    if (preserveIdentity) engine.reset({ preserveIdentity: true });
    else engine.reset();
  }

  function errorMessage(data) {
    return typeof data?.error === "string" && /[가-힣]/.test(data.error) && data.error.length <= 160
      ? data.error
      : "AI 응답을 받아오지 못했어요. 잠시 후 다시 시도해 주세요.";
  }

  async function requestReply(message, retry = false) {
    if (activeRequest || demoMode) return;
    archiveWorkflow();
    if (!retry) liveRows.push({ role: "user", text: message });
    offer = null;
    failedRequest = null;
    const scopeReply = window.SKIXChat.corporateReply(message) || window.SKIXChat.inboundReviewReply(message);
    if (scopeReply) {
      liveRows.push({ role: "bot", text: scopeReply });
      apiHistory = [];
      lastScenario = null;
      update({ focus: true });
      return;
    }
    const controller = new AbortController();
    const request = { controller, timer: setTimeout(() => controller.abort(), timeoutMs) };
    activeRequest = request;
    update();
    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        signal: controller.signal,
        body: JSON.stringify({ message, history: apiHistory.slice(-12), scenario: lastScenario ?? undefined })
      });
      const data = await response.json().catch(() => null);
      if (activeRequest !== request) return;
      if (!response.ok || typeof data?.reply !== "string" || !data.reply.trim()) {
        failedRequest = { message, error: errorMessage(data) };
      } else {
        const reply = data.reply.trim();
        liveRows.push({ role: "bot", text: reply, source: "api" });
        apiHistory.push({ role: "user", content: message }, { role: "assistant", content: reply });
        apiHistory = apiHistory.slice(-12);
        const suggested = scenarios.get(Number(data.scenarioId));
        offer = suggested?.screens[0]?.kind === "internal-only" ? null : suggested ?? null;
        lastScenario = offer?.no ?? lastScenario;
      }
    } catch (error) {
      if (activeRequest !== request) return;
      failedRequest = {
        message,
        error: error.name === "AbortError"
          ? "응답 시간이 길어지고 있어요. 다시 시도해 주세요."
          : "AI에 연결하지 못했어요. 다시 시도해 주세요."
      };
    } finally {
      clearTimeout(request.timer);
      if (activeRequest === request) {
        activeRequest = null;
        if (offer?.no === 6) startWorkflow(offer);
        else update();
      }
    }
  }

  function send(message) {
    const text = String(message ?? "").trim();
    if (!text || activeRequest) return;
    composerEntry().value = "";
    if (inputProgress) {
      captureInput(text);
    } else if (demoMode) {
      engine.submit(text);
      update({ focus: true });
    } else {
      requestReply(text);
      input.focus({ preventScroll: true });
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const editor = composerEntry();
    if (!editor.disabled) send(editor.value);
  });
  form.addEventListener("input", resizeInput);
  form.addEventListener("keydown", (event) => {
    if (event.target !== composerEntry()) return;
    if (event.key !== "Enter" || event.shiftKey || event.isComposing || event.keyCode === 229) return;
    event.preventDefault();
    if (!sendButton.disabled) form.requestSubmit();
  });
  byId("starters").addEventListener("click", (event) => {
    const starter = event.target.closest("[data-question]");
    if (starter) send(starter.dataset.question);
  });
  byId("new-chat").addEventListener("click", () => {
    clearConversation();
    openPhases.clear();
    openPhases.add(defaultCatalogPhase);
    catalogSearch.value = "";
    catalogList.scrollTop = 0;
    renderCatalog();
    setDrawer(mobileCatalog.matches, false);
    update({ focus: !drawerOpen });
  });
  byId("schedule-sheet-close").addEventListener("click", () => closeScheduleSheet(true));
  scheduleSheet.addEventListener("cancel", (event) => {
    event.preventDefault();
    closeScheduleSheet(true);
  });
  scheduleSheet.addEventListener("click", (event) => {
    if (event.target === scheduleSheet) closeScheduleSheet(true);
  });
  scheduleSheet.addEventListener("keydown", (event) => {
    if (event.key !== "Tab") return;
    const focusable = [...scheduleSheet.querySelectorAll("button:not(:disabled)")]
      .filter((item) => item.getClientRects().length);
    const active = document.activeElement;
    const edge = event.shiftKey ? focusable[0] : focusable.at(-1);
    if (!focusable.includes(active) || active === edge) {
      event.preventDefault();
      (event.shiftKey ? focusable.at(-1) : focusable[0])?.focus();
    }
  });

  catalogToggle.addEventListener("click", () => setDrawer(!drawerOpen));
  catalogClose.addEventListener("click", () => setDrawer(false));
  catalogBackdrop.addEventListener("click", () => setDrawer(false));
  mobileCatalog.addEventListener("change", () => setDrawer(app.classList.contains("is-empty"), false));
  catalogAll.addEventListener("click", () => {
    const collapse = !catalogSearch.value.trim() && openPhases.size === catalogPhases.length;
    openPhases.clear();
    if (!collapse) for (const { id } of catalogPhases) openPhases.add(id);
    catalogSearch.value = "";
    catalogList.scrollTop = 0;
    renderCatalog();
  });
  catalogSearch.addEventListener("input", () => {
    catalogList.scrollTop = 0;
    renderCatalog();
  });
  catalogSearch.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    const [match] = engine.find(catalogSearch.value.trim());
    if (match) {
      event.preventDefault();
      catalogList.querySelector(`[data-scenario="${match.no}"]:not(:disabled)`)?.focus();
    }
  });
  catalogPhaseButtons.addEventListener("click", (event) => {
    const toggle = event.target.closest("[data-phase]");
    if (!toggle) return;
    const id = Number(toggle.dataset.phase);
    catalogSearch.value = "";
    openPhases.add(id);
    renderCatalog(id);
    if (event.detail === 0) {
      byId(`catalog-phase-${id}`).querySelector("[data-scenario]:not(:disabled)")?.focus({ preventScroll: true });
    }
  });
  catalogList.addEventListener("click", (event) => {
    const collapse = event.target.closest("[data-collapse-phase]");
    if (collapse) {
      const id = Number(collapse.dataset.collapsePhase);
      openPhases.delete(id);
      renderCatalog(id);
      return;
    }
    const item = event.target.closest("[data-scenario]");
    if (item) startWorkflow(scenarios.get(Number(item.dataset.scenario)), true);
  });
  document.addEventListener("keydown", (event) => {
    if (!drawerOpen) return;
    if (event.key === "Escape") {
      event.preventDefault();
      setDrawer(false);
      return;
    }
    if (event.key !== "Tab") return;
    const focusable = [...catalog.querySelectorAll("button:not(:disabled), input, a[href]")]
      .filter((item) => item.getClientRects().length);
    const first = focusable[0];
    const last = focusable.at(-1);
    if (!first) return;
    const active = document.activeElement;
    if (!catalog.contains(active) || (event.shiftKey ? active === first : active === last)) {
      event.preventDefault();
      (event.shiftKey ? last : first).focus();
    }
  });

  if (phaseOne) {
    catalogAll.hidden = true;
    catalogPhaseButtons.hidden = true;
    byId("catalog-title").textContent = "1차 상담 메뉴";
  }
  renderCatalog();
  setDrawer(mobileCatalog.matches, false);
  update();
})();
  </script>
</body>
